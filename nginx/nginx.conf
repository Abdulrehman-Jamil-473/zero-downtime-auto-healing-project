# This file decides which backend (blue or green) is currently LIVE.
# To switch traffic, change the IP/port inside 'upstream backend_active'
# and reload nginx (nginx -s reload) — no downtime for users.

upstream backend_active {
    server backend-blue:3000;   # <-- currently live slot
    # server backend-green:3000;  <-- swap to this line to switch to green
}

server {
    listen 80;

    # Serve the frontend static files
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # Proxy API/health requests to whichever backend is active
    location /api/ {
        proxy_pass http://backend_active;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://backend_active;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
